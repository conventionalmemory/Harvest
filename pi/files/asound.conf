defaults.pcm.!card Headphones
defaults.ctl.!card Headphones
pcm.retrotv_hw {
    type plug
    slave.pcm "hw:CARD=Headphones,DEV=0"
}
pcm.retrotv_raw {
    type plug
    slave.pcm "dmix:CARD=Headphones,DEV=0"
}
pcm.retrotv_dsp {
    type plug
    slave.pcm "retrotv_lad"
}
pcm.retrotv_lad {
    type ladspa
    slave.pcm "retrotv_raw"
    path "/usr/lib/ladspa"
    channels 2
    plugins [
        { label highpass_iir policy duplicate input { controls [ 90 2 ] } }
        { label notch_iir policy duplicate input { controls [ 120 10 1 ] } }
        { label notch_iir policy duplicate input { controls [ 180 12 1 ] } }
        { label sc4 input { controls [ 1 40 800 -30 5 6 14 ] } }
        { label fastLookaheadLimiter input { controls [ 0 -1 0.12 ] } }
    ]
}
