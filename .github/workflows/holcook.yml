name: Holiday cooking
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-write
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 harvest/holcook.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/holcook.json.gz
          git commit -m "Holiday cooking" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
