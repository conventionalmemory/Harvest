name: Gap categories harvest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Search the archive
        run: MODE=plan python3 harvest/gaps.py
      - uses: actions/upload-artifact@v4
        with:
          name: gaps-cands
          path: parts/gaps_cands.json.gz
          retention-days: 3
  lookup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gaps-cands
          path: parts
      - name: Look up programs
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=8 THREADS=16 BUDGET_MIN=320 python3 harvest/gaps.py
      - uses: actions/upload-artifact@v4
        with:
          name: gaps-${{ matrix.shard }}
          path: parts/gaps-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: lookup
    if: ${{ !cancelled() && needs.lookup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gaps-[0-9]*
          path: parts
          merge-multiple: true
      - name: Merge
        run: ls -la parts; MODE=merge python3 harvest/gaps.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/gaps.json.gz
          git commit -q -m "Update gap categories catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
