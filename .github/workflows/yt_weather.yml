name: Weather Channel recordings
on:
  workflow_dispatch:
    inputs:
      budget:
        description: minutes
        default: "40"
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: BUDGET_MIN='${{ inputs.budget }}' MODE=lib python3 harvest/yt_weather.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          cp catalog/yt_weather.json.gz /tmp/w.gz
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/w.gz catalog/yt_weather.json.gz && git add catalog/yt_weather.json.gz
            git diff --cached --quiet && exit 0
            git commit -q -m "Update Weather Channel recordings" && git push -q && exit 0
            sleep $((5 + RANDOM % 15))
          done
          exit 1
