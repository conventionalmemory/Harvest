name: Dated broadcasts harvest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Search the archive
        run: MODE=plan python3 harvest/dated.py
      - uses: actions/upload-artifact@v4
        with:
          name: dated-cands
          path: parts/dated_cands.json.gz
          retention-days: 3
  lookup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: dated-cands
          path: parts
      - name: Look up broadcasts
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=8 THREADS=16 BUDGET_MIN=320 python3 harvest/dated.py
      - uses: actions/upload-artifact@v4
        with:
          name: dated-${{ matrix.shard }}
          path: parts/dated-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: lookup
    if: ${{ !cancelled() && needs.lookup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: dated-[0-9]*
          path: parts
          merge-multiple: true
      - name: Merge
        run: ls -la parts; MODE=merge python3 harvest/dated.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/dated.json.gz
          git commit -q -m "Update dated broadcasts catalog" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push && break; sleep $((10 + RANDOM % 30)); done
