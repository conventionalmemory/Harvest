name: Harvest catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Search the archive
        run: MODE=plan LIMIT=250000 QFILES=queries3.txt python3 harvest/harvest.py
      - uses: actions/upload-artifact@v4
        with:
          name: cands
          path: parts/cands.json.gz
          retention-days: 3
  programs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: cands
          path: parts
      - name: Look up programs
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=8 LIMIT=250000 THREADS=16 BUDGET_MIN=320 QFILES=queries3.txt python3 harvest/harvest.py
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: parts/shard-${{ matrix.shard }}.json.gz
          retention-days: 3
  ads:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Look up commercials
        run: SHARD=${{ matrix.shard }} SHARDS=4 THREADS=12 python3 harvest/harvest_ads.py
      - uses: actions/upload-artifact@v4
        with:
          name: ads-${{ matrix.shard }}
          path: parts/ads-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: [programs, ads]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ads-*
          path: parts
          merge-multiple: true
      - name: Merge
        run: ls -la parts; python3 harvest/merge.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/raw.json.gz catalog/ads.json.gz
          git commit -q -m "Update program and commercial catalogs" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
