name: Title hunt
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Item keys to search, separated by |'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: hunt
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Search
        env:
          ONLY: ${{ inputs.only }}
        run: python3 harvest/hunt.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          cp catalog/hunt_found.json /tmp/hf.json
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/hf.json catalog/hunt_found.json && git add catalog/hunt_found.json || { sleep $((10 + RANDOM % 20)); continue; }
            git diff --cached --quiet && exit 0
            git commit -q -m "Update title hunt" && git push origin HEAD:main && exit 0
            sleep $((10 + RANDOM % 20))
          done
          exit 1
