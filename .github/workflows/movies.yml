name: Video store shelf
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build the shelf
        run: python3 harvest/movies.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/movies.json.gz
          git commit -q -m "Update video store shelf" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
