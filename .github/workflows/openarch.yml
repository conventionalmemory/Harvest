name: Open archives harvest
on:
  workflow_dispatch:
    inputs:
      mode:
        default: run
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        run: MODE=${{ inputs.mode }} BUDGET_MIN=200 python3 harvest/openarch.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/openarch.json.gz 2>/dev/null || exit 0
          git commit -q -m "Update open archives catalog" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push && break; sleep $((10 + RANDOM % 30)); done
