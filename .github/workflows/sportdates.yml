name: Sports schedule dating
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild schedule tables
        default: '0'
      only:
        description: Stop after the schedule tables
        default: '0'
      probe:
        description: Page titles to print parsed rows for
        default: ''
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Print parsed rows
        if: ${{ inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: MODE=probe python3 harvest/sportdates.py
      - name: Build tables and search the archive
        if: ${{ inputs.probe == '' }}
        run: MODE=plan REBUILD=${{ inputs.rebuild }} ONLY=${{ inputs.only }} FETCH_BUDGET_MIN=120 PLAN_BUDGET_MIN=300 python3 harvest/sportdates.py
      - name: Commit schedule tables
        if: ${{ always() && inputs.probe == '' }}
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/sportsched.json.gz || exit 0
          git add catalog/sportsched_nopages.json catalog/sportsched_pages.json.gz 2>/dev/null || true
          git commit -q -m "Update sports schedule tables" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push && break; sleep $((10 + RANDOM % 30)); done
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.probe == '' }}
        with:
          name: sports2-cands
          path: |
            parts/sports2_cands.json.gz
            parts/sportsched.json.gz
          retention-days: 3
  lookup:
    needs: plan
    if: ${{ inputs.probe == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: sports2-cands
          path: parts
      - name: Look up broadcasts
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=6 THREADS=16 BUDGET_MIN=320 python3 harvest/sportdates.py
      - uses: actions/upload-artifact@v4
        with:
          name: sports2-${{ matrix.shard }}
          path: parts/sports2-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: lookup
    if: ${{ !cancelled() && needs.lookup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: sports2-*
          path: parts
          merge-multiple: true
      - name: Merge
        run: ls -la parts; MODE=merge python3 harvest/sportdates.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/sports2.json.gz catalog/sports2_times.json.gz
          git commit -q -m "Update schedule-dated sports catalog" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push && break; sleep $((10 + RANDOM % 30)); done
