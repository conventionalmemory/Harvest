name: Must-have cartoons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  musthave:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Harvest
        run: python3 harvest/musthave.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/musthave.json.gz
          git commit -q -m "Update must-have cartoon catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
