name: Nick and tween harvest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Search the archive
        run: MODE=plan python3 harvest/nick.py
      - uses: actions/upload-artifact@v4
        with:
          name: nick-cands
          path: parts/nick_cands.json.gz
          retention-days: 3
  lookup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: nick-cands
          path: parts
      - name: Look up programs
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=4 THREADS=16 BUDGET_MIN=320 python3 harvest/nick.py
      - uses: actions/upload-artifact@v4
        with:
          name: nick-${{ matrix.shard }}
          path: parts/nick-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: lookup
    if: ${{ !cancelled() && needs.lookup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: nick-[0-9]*
          path: parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nick-cands
          path: parts
      - name: Merge
        run: ls -la parts; MODE=merge python3 harvest/nick.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/nick.json.gz catalog/nick_guide.json.gz
          git commit -q -m "Update Nick and tween catalog" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push && break; sleep $((10 + RANDOM % 20)); done
