name: Filler harvest
on:
  workflow_dispatch:
    inputs:
      qonly:
        description: optional comma-separated groups to run (others kept)
        default: ""
permissions:
  contents: write
jobs:
  filler:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Harvest filler
        run: THREADS=16 QONLY='${{ inputs.qonly }}' python3 harvest/filler.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/filler.json.gz
          git commit -q -m "Update filler catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
