name: Primetime harvest
on:
  workflow_dispatch:
    inputs:
      focus:
        description: Show titles separated by semicolons, or guide, or must
        required: false
        default: ''
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          FOCUS: ${{ inputs.focus }}
        run: MODE=plan python3 harvest/primetime.py
      - uses: actions/upload-artifact@v4
        with:
          name: pt-cands
          path: |
            parts/cands.json.gz
            parts/guide.json
          retention-days: 3
  lookup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pt-cands
          path: parts
      - name: Look up
        run: MODE=meta SHARD=${{ matrix.shard }} SHARDS=6 THREADS=16 BUDGET_MIN=320 python3 harvest/primetime.py
      - uses: actions/upload-artifact@v4
        with:
          name: pt-${{ matrix.shard }}
          path: parts/pt-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: lookup
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: pt-*
          path: parts
          merge-multiple: true
      - name: Merge
        env:
          FOCUS: ${{ inputs.focus }}
        run: MODE=merge python3 harvest/primetime.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/primetime.json.gz
          git add harvest/guide_primetime.json || true
          git commit -q -m "Update primetime catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
