name: Cartoon harvest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  toons:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Harvest cartoons
        run: python3 harvest/toons.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/toons.json.gz
          git commit -q -m "Update cartoon catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
