name: Video episodes for lineup gaps
on:
  workflow_dispatch:
    inputs:
      mode:
        description: full, clean or probe
        default: full
      pri:
        description: priorities to search, for example 1 or 12 or 123
        default: "1"
      only:
        description: optional show titles separated by |
        default: ""
      budget:
        description: minutes per search shard
        default: "60"
      deep:
        description: per-episode query cap, 0 for default
        default: "0"
      style:
        description: query style, blank or offair
        default: ""
permissions:
  contents: write
concurrency:
  group: yt-needs
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ inputs.mode == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: MODE=probe python3 harvest/yt_needs.py
  plan:
    if: ${{ inputs.mode != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        env:
          PRI: ${{ inputs.pri }}
          ONLY: ${{ inputs.only }}
          DEEP: ${{ inputs.deep }}
          STYLE: ${{ inputs.style }}
        run: MODE=plan python3 harvest/yt_needs.py
      - uses: actions/upload-artifact@v4
        with:
          name: ytn-plan
          path: parts/ytn_plan.json.gz
          retention-days: 3
  search:
    needs: plan
    if: ${{ inputs.mode != 'clean' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ytn-plan
          path: parts
      - run: pip install -q yt-dlp
      - name: Search
        env:
          BUDGET_MIN: ${{ inputs.budget }}
          STYLE: ${{ inputs.style }}
        run: MODE=search SHARD=${{ matrix.shard }} SHARDS=6 THREADS=4 python3 harvest/yt_needs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytn-${{ matrix.shard }}
          path: parts/ytn-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: [plan, search]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ytn-plan
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ytn-[0-9]*
          path: parts
          merge-multiple: true
      - name: Merge
        env:
          STYLE: ${{ inputs.style }}
        run: ls -la parts; MODE=merge python3 harvest/yt_needs.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          cp catalog/yt_needs.json.gz /tmp/yt_needs.json.gz
          cp catalog/yt_needs_report.json /tmp/yt_needs_report.json
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/yt_needs.json.gz catalog/yt_needs.json.gz && cp /tmp/yt_needs_report.json catalog/yt_needs_report.json && git add catalog/yt_needs.json.gz catalog/yt_needs_report.json || { sleep $((10 + RANDOM % 20)); continue; }
            git diff --cached --quiet && exit 0
            git commit -q -m "Update lineup gap video episodes catalog" && git push origin HEAD:main && exit 0
            sleep $((10 + RANDOM % 20))
          done
          exit 1
