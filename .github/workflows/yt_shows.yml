name: Video episodes harvest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: full, focus, dated, channels, deep, clean or probe
        default: full
permissions:
  contents: write
jobs:
  probe:
    if: ${{ inputs.mode == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: MODE=probe python3 harvest/yt_shows.py
  plan:
    if: ${{ inputs.mode != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        run: MODE=plan FOCUS=${{ inputs.mode == 'focus' && '1' || inputs.mode == 'dated' && '2' || '0' }} python3 harvest/yt_shows.py
      - uses: actions/upload-artifact@v4
        with:
          name: yt-plan
          path: parts/yt_plan.json.gz
          retention-days: 3
  search:
    needs: plan
    if: ${{ inputs.mode != 'clean' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: yt-plan
          path: parts
      - run: pip install -q yt-dlp
      - name: Search
        run: MODE=search CHANNELS=${{ inputs.mode == 'channels' && '1' || inputs.mode == 'deep' && '2' || '0' }} SHARD=${{ matrix.shard }} SHARDS=6 THREADS=4 BUDGET_MIN=150 python3 harvest/yt_shows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-${{ matrix.shard }}
          path: parts/yt-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: [plan, search]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: yt-plan
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: yt-[0-9]*
          path: parts
          merge-multiple: true
      - name: Merge
        run: ls -la parts; MODE=merge python3 harvest/yt_shows.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          cp catalog/yt_shows.json.gz /tmp/yt_shows.json.gz
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/yt_shows.json.gz catalog/yt_shows.json.gz && git add catalog/yt_shows.json.gz || { sleep $((10 + RANDOM % 20)); continue; }
            git diff --cached --quiet && exit 0
            git commit -q -m "Update video episodes catalog" && git push origin HEAD:main && exit 0
            sleep $((10 + RANDOM % 20))
          done
          exit 1
