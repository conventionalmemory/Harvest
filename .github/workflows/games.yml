name: Game show harvest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Harvest game shows
        run: THREADS=14 python3 harvest/games.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/games.json.gz
          git commit -q -m "Update game show catalog" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 10; done
