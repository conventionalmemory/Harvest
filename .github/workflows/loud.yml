name: Audio loudness
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per shard
        required: false
        default: '330'
permissions:
  contents: write
concurrency:
  group: loud
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Measure
        run: MODE=run SHARD=${{ matrix.shard }} SHARDS=8 PAR=6 BUDGET_MIN='${{ github.event.inputs.minutes }}' python3 harvest/loud.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loud-${{ matrix.shard }}
          path: parts/loud-${{ matrix.shard }}.json.gz
          retention-days: 3
  merge:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: loud-*
          path: parts
      - name: Merge
        run: MODE=merge python3 harvest/loud.py
      - name: Commit
        run: |
          git config user.name "Conventional Memory"
          git config user.email "conventionalmemory@users.noreply.github.com"
          git add catalog/loud.json.gz
          git commit -m "Update audio loudness" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
